<!doctype html>
<html lang="pt-BR" class="is-loading is-locked">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Monster Energy · sete latas</title>
    <meta name="description" content="Estudo conceitual: uma lata, sete versões da linha Monster Energy." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <link rel="preload" href="/claw-intro.webp" as="image" />
    <link rel="preload" href="/models/can.glb" as="fetch" crossorigin />
    <!-- Só a abertura: precisa estar pronta antes do CSS do app chegar -->
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      .is-locked {
        overflow: hidden;
      }
      .intro {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .intro__bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 60% 55% at 50% 46%, #080a08, #000);
      }
      .intro__light {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        mix-blend-mode: screen;
      }
      /* a garra fica exatamente onde a garra impressa da lata aparece na
         primeira tela; o JS põe o retângulo medido (src/ui/intro-claw.json) */
      .intro__mark {
        position: absolute;
        inset: 0;
      }
      .intro__claw {
        position: absolute;
        left: var(--claw-x);
        top: var(--claw-y);
        width: var(--claw-w);
        height: var(--claw-h);
      }
      .intro__logo {
        display: block;
        width: 100%;
        height: 100%;
        opacity: 0;
        --reveal: -30%;
        -webkit-mask-image: linear-gradient(100deg, #000 calc(var(--reveal) - 35%), transparent var(--reveal));
        mask-image: linear-gradient(100deg, #000 calc(var(--reveal) - 35%), transparent var(--reveal));
      }
      /* a mesma garra com as cores do rótulo: é nela que a branca vira cinza */
      .intro__tone {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
      }
      .intro__word {
        position: absolute;
        left: var(--word-x);
        top: var(--word-y);
        translate: -50% 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7em;
        color: #f4f4f1;
        font: 800 min(4.4vh, 44px) / 1 'Archivo Variable', 'Archivo', system-ui, sans-serif;
        font-variation-settings: 'wdth' 125;
        text-transform: uppercase;
      }
      /* as letras entram uma a uma (JS); até lá, nada aparece */
      .intro__word > span {
        display: block;
        visibility: hidden;
        letter-spacing: 0.16em;
        margin-right: -0.16em;
      }
      .intro__word > span + span {
        font-size: 0.34em;
        font-weight: 600;
        letter-spacing: 0.78em;
        margin-right: -0.78em;
        color: #a9f803;
      }
      .intro__word i {
        position: relative;
        font-style: normal;
      }
      /* cada letra nasce acesa e assenta na cor dela */
      .intro__word i.is-on {
        visibility: visible;
        animation: intro-lit 0.6s ease-out;
      }
      @keyframes intro-lit {
        from {
          color: #fff;
          text-shadow:
            0 0 4px #fff,
            0 0 18px rgba(236, 255, 214, 0.85);
        }
        to {
          text-shadow: 0 0 0 rgba(236, 255, 214, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .intro__word i.is-on {
          animation: none;
        }
      }
      .intro__caret {
        position: absolute;
        left: calc(100% + 0.08em);
        top: 0.08em;
        bottom: 0.08em;
        width: 2px;
        background: #a9f803;
        visibility: visible;
      }
      /* o convite para rolar: a barrinha da digitação cai até aqui e vira um
         fio; uma gota de luz desce por ele sem parar */
      .intro__hint {
        position: absolute;
        left: 50%;
        bottom: 5vh;
        translate: -50% 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        visibility: hidden;
      }
      .intro__hint.is-on {
        visibility: visible;
      }
      .intro__hint-line {
        position: relative;
        width: 2px;
        height: 56px;
        overflow: hidden;
        background: #a9f803;
        transition: background-color 0.8s;
      }
      .intro__hint.is-flowing .intro__hint-line {
        background: rgba(169, 248, 3, 0.16);
      }
      .intro__hint.is-flowing .intro__hint-line::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent, #a9f803 70%, transparent);
        animation: intro-drop 2s cubic-bezier(0.6, 0, 0.3, 1) infinite;
      }
      @keyframes intro-drop {
        from {
          translate: 0 -100%;
        }
        to {
          translate: 0 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .intro__hint.is-flowing .intro__hint-line::after {
          animation: none;
        }
      }
      .intro__hint-text {
        color: #7d8288;
        font: 500 13px/1 'Archivo Variable', 'Archivo', system-ui, sans-serif;
        letter-spacing: 0.04em;
        opacity: 0;
      }
      .intro__count {
        position: absolute;
        left: 50%;
        top: 36px;
        translate: -50% 0;
        margin: 0;
        color: #5e636a;
        font: 600 13px/1 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        opacity: 0;
        transition: opacity 0.4s;
      }
      .intro__count.is-visible {
        opacity: 1;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="intro" data-intro aria-hidden="true">
      <div class="intro__bg" data-intro-bg></div>
      <div class="intro__mark" data-intro-mark>
        <div class="intro__claw" data-intro-claw>
          <img class="intro__logo" data-logo src="/claw-intro.webp" width="597" height="1000" alt="" decoding="async" />
          <img class="intro__tone" data-intro-tone src="/claw-intro-color.webp" width="597" height="1000" alt="" decoding="async" />
        </div>
        <p class="intro__word" data-intro-word><span>Monster</span><span>Energy</span></p>
      </div>
      <canvas class="intro__light" data-intro-light></canvas>
      <div class="intro__hint" data-intro-hint>
        <span class="intro__hint-line" data-intro-hint-line></span>
        <span class="intro__hint-text" data-intro-hint-text>Unleash the Beast</span>
      </div>
      <p class="intro__count" data-loader><span data-loader-value>0</span>%</p>
    </div>

    <div class="stage" aria-hidden="true">
      <canvas class="stage__canvas" data-canvas></canvas>
      <img class="stage__fallback-bg" data-fallback-bg alt="" decoding="async" />
      <img class="stage__poster" data-poster alt="" decoding="async" />
    </div>

    <header class="bar">
      <p class="bar__brand">Monster Energy</p>
    </header>

    <div class="moves" aria-hidden="true">
      <div class="move move--left" data-move>
        <p>Sabor completo.</p>
        <p>Zero açúcar.</p>
      </div>
      <div class="move move--right" data-move>
        <p>Libere o seu Monster.</p>
        <p>Monster Energy Ultra, 473 ml.</p>
      </div>
    </div>

    <section class="catalog" data-catalog aria-labelledby="product">
      <div class="catalog__info">
        <h1 class="catalog__name" id="product" data-name></h1>
      </div>
      <div class="catalog__side" data-side>
        <p class="catalog__caption"><span data-caption></span><span data-caption></span></p>
        <p class="catalog__facts" data-facts></p>
      </div>
      <p class="sr-only" aria-live="polite" data-announce></p>
    </section>

    <main class="story" data-story></main>

    <div class="journey" data-journey-layer>
      <section class="wheel" data-wheel aria-labelledby="collection-title">
        <div class="wheel__glow"></div>
        <canvas class="wheel__gl" data-wheel-gl></canvas>
        <div class="wheel__stage">
          <div class="wheel__drum" data-wheel-drum></div>
        </div>
        <h2 class="wheel__label" id="collection-title" data-wheel-label>A coleção</h2>
        <div class="wheel__panel" data-wheel-title>
          <p class="wheel__name" data-wheel-name></p>
          <p class="wheel__product" data-wheel-product></p>
          <p class="wheel__desc" data-wheel-desc></p>
          <p class="wheel__facts" data-wheel-facts></p>
          <button class="wheel__go" type="button" data-wheel-go>Ver no catálogo</button>
        </div>
        <ol class="wheel__index" data-wheel-index aria-label="Produtos da coleção"></ol>
      </section>
    </div>

    <svg class="rip" aria-hidden="true" preserveAspectRatio="none">
      <path data-rip-soft class="rip__soft" />
      <path data-rip-edge class="rip__edge" />
    </svg>

    <footer class="foot">
      <p>Estudo conceitual, sem vínculo com a Monster Energy Company. Marcas, nomes e embalagens pertencem aos seus donos.</p>
    </footer>
  </body>
</html>
